[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Static assets resolve normally — a missing file 404s instead of returning the SPA shell
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# Single-page app: let React Router handle /projects/* routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
