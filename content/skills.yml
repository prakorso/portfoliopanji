framework:
  label: How I think
  title: "A business-first approach to building "
  titleAccent: marketing that compounds.
  lead: Connecting brand, digital, performance and growth around clear business
    objectives — with customer understanding shaping the strategy and data
    guiding what comes next.
  steps:
    - number: "01"
      title: Understand
      caption: Start with the business, customer and market before defining the
        marketing problem.
      points:
        - Business Objectives
        - Customer & Market
        - Commercial Context
    - number: "02"
      title: Strategize
      caption: Translate business objectives into a clear marketing strategy, from
        positioning and audience to channel and funnel.
      points:
        - Positioning
        - Audience
        - Channel Strategy
        - Funnel
    - number: "03"
      title: ORCHESTRATE
      caption: Bring people, channels and capabilities together to turn strategy into
        coordinated market execution.
      points:
        - Cross Functional Teams
        - Integrated Campaigns
        - Digital & Performance
        - Stakeholders
    - number: "04"
      title: MEASURE & SCALE
      caption: Turn performance data into decisions that improve efficiency, prove
        impact and guide the next investment.
      points:
        - Measurement
        - Efficiency
        - ROI
        - Growth
