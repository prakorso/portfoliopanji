chapters:
  - label: Brand Context
    title: Building a distinct proposition within a competitive category
    body:
      - Axioo operates across a highly competitive technology market, where
        product differentiation needs to be supported by strong brand relevance,
        digital visibility and customer understanding.
      - The marketing scope evolved beyond individual campaigns — connecting
        brand communication, product storytelling and digital initiatives into a
        more consistent customer experience.
    bullets: []
    columns: []
  - label: Digital Ecosystem
    title: Presence built to convert, not just to exist
    body:
      - Digital became a core part of the marketing ecosystem — connecting
        website, content, social media, SEO and campaign destinations to support
        discovery, engagement and conversion.
    bullets:
      - Website and product experience as a central digital touchpoint
      - Campaign landing experiences aligned with audience intent
      - Analytics and measurement to understand audience behaviour
      - Digital content supporting product consideration
      - SEO and content supporting long-term discovery
      - Connected touchpoints across the customer journey
    columns: []
  - label: Full-Funnel Marketing
    title: One funnel, three jobs
    body:
      - Marketing activity was structured around the full customer journey —
        connecting awareness, consideration and conversion rather than treating
        each stage as an isolated campaign.
    bullets: []
    columns:
      - title: Awareness
        items:
          - Brand Storytelling
          - COntent & Community Reach
          - Creator-led Awareness
      - title: Consideration
        items:
          - Product Education
          - Reviews & SOcial Proof
          - Retargeting & Engagament
      - title: Conversion
        items:
          - Performance Campaign
          - High Intent Product Communication
          - Landing Page & Marketplace Alignment
  - label: Performance Marketing
    title: Performance built around efficiency and growth
    body:
      - Performance marketing was managed around audience intent, campaign
        architecture and disciplined measurement — using data to improve
        efficiency, inform budget allocation and strengthen acquisition
        outcomes.
    bullets:
      - Audience segmentation around intent and funnel stage
      - Creative testing across hooks, formats and messaging
      - Campaign structure aligned with commercial objectives
      - Landing-page and post-click improvements
      - Budget and placement optimisation
      - Measurement connecting media activity with business outcomes
    columns: []
  - label: Creator Partnerships
    title: Building credibility beyond paid media
    body:
      - Creator and technology-reviewer partnerships extended product
        communication into trusted communities, translating product value
        through more relevant and audience-native storytelling.
    bullets:
      - Creator selection based on audience fit
      - Creator briefs designed for authentic product storytelling
      - Product seeding and review-led communication
      - Community engagement beyond campaign windows
      - Content adapted across digital channels
      - Creator content supporting consideration and reach
    columns: []
