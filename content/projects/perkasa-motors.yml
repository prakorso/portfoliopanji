chapters:
  - label: Business Context
    title: Building the commercial foundation before scaling the business.
    body:
      - Perkasa Motors was built from the ground up as a modern automotive
        business, requiring more than a sales channel. The challenge was to
        establish a clear business model, credible brand and digital foundation
        that could support sustainable growth.
      - "With no inherited brand equity, customer base or established marketing
        infrastructure, every decision had to connect back to the fundamentals:
        who we serve, what we offer, how we create demand and how that demand
        converts into business value."
    bullets: []
    columns: []
  - label: Brand
    title: Building trust before asking customers to buy.
    body:
      - Automotive is a high-consideration category where customers evaluate
        more than price. The brand therefore needed to communicate credibility,
        transparency and confidence across every customer touchpoint.
    bullets:
      - Clear positioning around trust, transparency and value
      - Consistent brand expression across digital touchpoints
      - Communication designed to reduce uncertainty before inquiry
      - Customer experience treated as part of the brand
    columns: []
  - label: Business Model
    title: Marketing decisions grounded in business economics.
    body:
      - In automotive, marketing cannot be evaluated in isolation. Inventory,
        acquisition cost, pricing, margin and sales velocity all influence
        whether growth actually creates value.
    bullets:
      - Inventory selection aligned with customer demand
      - Pricing and positioning considered alongside acquisition efficiency
      - Marketing investment evaluated against potential business return
      - Customer acquisition connected to inventory movement and sales outcomes
    columns: []
  - label: Digital Ecosystem
    title: Building the digital foundation before scaling acquisition.
    body:
      - The digital ecosystem was designed as an owned foundation for the
        business — connecting brand presence, inventory discovery, content, lead
        generation and customer data rather than treating each channel as a
        standalone activity.
    bullets:
      - Website as the central inventory and brand destination
      - Digital presence designed around customer intent and discovery
      - Content and social channels supporting awareness and consideration
      - Analytics and lead flows connecting activity to commercial outcomes
    columns: []
  - label: Marketing
    title: Building a full-funnel marketing system around customer intent.
    body:
      - With a focused marketing budget, every channel needs a defined role. The
        approach connects awareness, consideration and conversion rather than
        treating campaigns as isolated activities.
    bullets: []
    columns:
      - title: Awareness
        items:
          - Brand storytelling and market education
          - Content designed to build familiarity and trust
      - title: Consideration
        items:
          - Inventory-led content and product discovery
          - Retargeting and intent-based communication
      - items:
          - High-intent lead generation
          - Landing experience and response flow aligned with sales
        title: Conversion
