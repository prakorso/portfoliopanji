# Decap CMS configuration — the admin at /admin edits the YAML files in /content.
#
# Saving commits to GitHub, which triggers a Netlify build, which publishes the
# site. There is no database and no separate publish step.

backend:
  name: github
  repo: prakorso/portfoliopanji
  branch: main
  # base_url is set at runtime in index.html to wherever the CMS is served from.
  # It points at the OAuth functions in netlify/functions/.
  auth_endpoint: api/auth

# Lets `npm run cms:proxy` write to local files during development.
local_backend: true

# Default upload location; collections and fields below override it.
media_folder: public/uploads/general
public_folder: /uploads/general

publish_mode: simple

collections:
  # ================================================================== Pages
  - name: pages
    label: Pages
    label_singular: Page
    delete: false
    editor:
      preview: true
    files:
      # ------------------------------------------------------------ Homepage
      - name: homepage
        label: Homepage
        file: content/homepage.yml
        format: yml
        description: >-
          The front page. The preview on the right shows exactly where each of
          these appears.
        fields:
          - label: "① Hero"
            name: hero
            widget: object
            collapsed: false
            hint: The first screen visitors see, at the very top of the homepage.
            fields:
              - label: Small text above the main heading
                name: eyebrow
                widget: string
                hint: The small blue text sitting above the big heading. Currently "Marketing Professional".
              - label: Main heading
                name: headingLines
                widget: list
                collapsed: false
                label_singular: Heading line
                summary: "{{fields.text}}"
                hint: >-
                  The huge headline, one line per row. Tick "Show this line in
                  blue" to highlight a line the way PERFORMANCE and GROWTH are.
                fields:
                  - { label: Line text, name: text, widget: string }
                  - { label: Show this line in blue, name: accent, widget: boolean, default: false }
              - label: Hero introduction
                name: description
                widget: text
                hint: The paragraph directly below the main heading.
              - label: Main button text
                name: primaryCtaLabel
                widget: string
                hint: The solid blue button. Currently "View selected work".
              - label: Main button link
                name: primaryCtaHref
                widget: string
                hint: 'Where the blue button jumps to. Use #projects, #about, #contact, or a full web address.'
              - label: Second button text
                name: secondaryCtaLabel
                widget: string
                hint: The outlined button next to the blue one.
              - label: Second button link
                name: secondaryCtaHref
                widget: string
                hint: 'Usually #contact.'
              - label: Hero photo
                name: image
                widget: image
                required: false
                media_folder: /public/uploads/profile
                public_folder: /uploads/profile
                hint: >-
                  The large photo on the right of the hero. A tall portrait crop
                  (roughly 4 wide by 5 tall) fits best. Use JPG or PNG — phone
                  HEIC files will not display in a browser.
              - label: Photo description
                name: imageAlt
                widget: string
                required: false
                hint: Describes the photo for screen readers and search engines. Not visible on the page.
              - label: Badge under the photo
                name: badge
                widget: string
                required: false
                hint: The small pill overlapping the bottom of the photo.

          - label: "② Hero statistics"
            name: stats
            widget: list
            collapsed: false
            label_singular: Statistic
            summary: "{{fields.value}} — {{fields.label}}"
            hint: >-
              The three figures directly under the hero, for example
              "8+ / Years Professional Experience".
            fields:
              - { label: Number, name: value, widget: string, hint: 'For example 8+, 3, or ∞' }
              - { label: Wording under the number, name: label, widget: string }

          - label: "③ Featured projects heading"
            name: projectsSection
            widget: object
            collapsed: false
            fields:
              - { label: Small label above the heading, name: label, widget: string }
              - { label: Section heading, name: title, widget: string, hint: 'Currently "Selected Work".' }
              - { label: Sentence under the heading, name: lead, widget: text }

          - label: "④ Projects shown on the homepage"
            name: featuredProjects
            widget: list
            collapsed: false
            label_singular: Project
            hint: >-
              Choose which projects appear in the homepage carousel, and drag to
              set their order. Removing one here keeps its own page working — it
              just hides it from the homepage.
            field:
              label: Project
              name: project
              widget: relation
              collection: projects
              search_fields: [title]
              display_fields: [title]
              value_field: "{{slug}}"

          - label: "⑤ Impact"
            name: impact
            widget: object
            collapsed: false
            hint: The band of large figures partway down the homepage.
            fields:
              - { label: Small label above the heading, name: label, widget: string }
              - { label: Section heading, name: title, widget: string, hint: 'Currently "Impact That Matters".' }
              - label: Impact numbers
                name: items
                widget: list
                collapsed: false
                label_singular: Number
                summary: "{{fields.value}} — {{fields.label}}"
                hint: The large figures shown across the Impact band.
                fields:
                  - { label: The number, name: value, widget: string, hint: 'For example 4X or +727%' }
                  - { label: What it measures, name: label, widget: string }
              - label: Who these results belong to
                name: attribution
                widget: string
                required: false
                hint: 'The company the results were achieved at, for example "Axioo Indonesia".'
              - label: Supporting text under the numbers
                name: note
                widget: text
                required: false
                hint: >-
                  The small print below the numbers. Keep it clear which company
                  and which period these results are from.

      # --------------------------------------------------------------- About
      - name: about
        label: About
        file: content/about.yml
        format: yml
        description: The About section on the homepage, and the four discipline cards beside it.
        fields:
          - { label: Small label above the heading, name: label, widget: string, hint: 'Currently "About me".' }
          - { label: Heading, name: heading, widget: string, hint: The first part of the heading, shown in white. }
          - label: Heading — highlighted part
            name: headingAccent
            widget: string
            required: false
            hint: The end of the heading, shown in blue.
          - { label: Description, name: description, widget: text, hint: The main paragraph under the heading. }
          - label: Extra note
            name: note
            widget: text
            required: false
            hint: The smaller, dimmer paragraph below the description. Leave empty to hide it.
          - label: About photo
            name: image
            widget: image
            required: false
            media_folder: /public/uploads/profile
            public_folder: /uploads/profile
            hint: Optional — the current About layout does not show a photo, so this is stored for later.
          - { label: CV button text, name: cvLabel, widget: string, required: false }
          - label: CV file to download
            name: cvUrl
            widget: file
            required: false
            media_folder: /public/uploads/general
            public_folder: /uploads/general
            hint: Upload your CV as a PDF. The Download CV button only appears once a file is here.
          - label: The four discipline cards
            name: disciplines
            widget: list
            collapsed: false
            label_singular: Discipline
            summary: "{{fields.number}} — {{fields.title}}"
            hint: The Brand / Digital / Performance / Growth cards to the right of the About text.
            fields:
              - { label: Number, name: number, widget: string, hint: 'For example 01' }
              - { label: Card title, name: title, widget: string }
              - label: One-line summary
                name: description
                widget: string
                required: false
                hint: Optional. Leave empty to keep the cards looking exactly as they do now.
              - label: Icon
                name: icon
                widget: select
                hint: The small line drawing in the corner of the card.
                options:
                  - { label: "Brand — hexagon", value: brand }
                  - { label: "Digital — screen", value: digital }
                  - { label: "Performance — target", value: performance }
                  - { label: "Growth — rising line", value: growth }
              - label: Bullet points on the card
                name: points
                widget: list
                field: { label: Point, name: point, widget: string }

      # ---------------------------------------------------------- Experience
      - name: experience
        label: Experience
        file: content/experience.yml
        format: yml
        description: The career timeline running across the middle of the homepage.
        fields:
          - { label: Small label above the heading, name: label, widget: string }
          - { label: Section heading, name: title, widget: string, hint: 'Currently "Career Milestones".' }
          - { label: Paragraph beside the heading, name: lead, widget: text, required: false }
          - label: Career milestones
            name: milestones
            widget: list
            collapsed: false
            label_singular: Milestone
            summary: "{{fields.year}} — {{fields.title}}"
            hint: Each entry becomes one point on the timeline, ordered by the number you give it below.
            fields:
              - { label: Year, name: year, widget: string }
              - { label: Position or title, name: title, widget: string }
              - label: Company
                name: company
                widget: string
                required: false
                hint: Optional. A small blue company line appears under the title only when filled in.
              - { label: Short description, name: description, widget: text }
              - label: Achievements
                name: achievements
                widget: list
                required: false
                hint: Optional bullet points under the description.
                field: { label: Achievement, name: achievement, widget: string }
              - label: Position on the timeline
                name: order
                widget: number
                value_type: int
                default: 1
                hint: 1 appears first (leftmost on desktop, top on mobile).

      # -------------------------------------------------------------- Skills
      - name: skills
        label: Skills
        file: content/skills.yml
        format: yml
        description: The "How I think" steps and the Tools & Technologies strip.
        fields:
          - label: Tools & technologies
            name: tools
            widget: object
            collapsed: false
            fields:
              - { label: Small label above the heading, name: label, widget: string }
              - { label: Heading, name: title, widget: string }
              - label: Tool groups
                name: groups
                widget: list
                collapsed: false
                label_singular: Group
                summary: "{{fields.group}}"
                hint: Each group is one row of tool chips.
                fields:
                  - { label: Group name, name: group, widget: string, hint: 'For example "Performance & Analytics".' }
                  - label: Tools in this group
                    name: tools
                    widget: list
                    field: { label: Tool, name: tool, widget: string }
          - label: How I think
            name: framework
            widget: object
            collapsed: false
            fields:
              - { label: Small label above the heading, name: label, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Heading — highlighted part, name: titleAccent, widget: string, required: false }
              - { label: Paragraph under the heading, name: lead, widget: text, required: false }
              - label: The four steps
                name: steps
                widget: list
                collapsed: false
                label_singular: Step
                summary: "{{fields.number}} — {{fields.title}}"
                fields:
                  - { label: Number, name: number, widget: string }
                  - { label: Step name, name: title, widget: string }
                  - { label: One-line summary, name: caption, widget: string, required: false }
                  - label: Bullet points
                    name: points
                    widget: list
                    field: { label: Point, name: point, widget: string }

      # ------------------------------------------------------------- Contact
      - name: contact
        label: Contact
        file: content/contact.yml
        format: yml
        description: The final section of the homepage, and the links in the footer.
        fields:
          - { label: Small label above the heading, name: label, widget: string }
          - { label: Heading, name: title, widget: string, hint: 'The white part, currently "Let''s build".' }
          - { label: Heading — highlighted part, name: titleAccent, widget: string, required: false, hint: 'The blue part, currently "what''s next.".' }
          - { label: Paragraph under the heading, name: lead, widget: text }
          - { label: Button text, name: ctaLabel, widget: string }
          - { label: Email address, name: email, widget: string, hint: Shown in the contact list and used by the button. }
          - label: Phone number
            name: phone
            widget: string
            required: false
            hint: >-
              Write it however you like, for example 082233184122. It is shown
              exactly as you type it, and clicking it opens a WhatsApp chat. The
              row only appears when this is filled in.
          - { label: Location, name: location, widget: string, required: false, hint: 'For example "Jakarta, Indonesia".' }
          - { label: LinkedIn — text to show, name: linkedinLabel, widget: string, required: false }
          - { label: LinkedIn — web address, name: linkedinUrl, widget: string, required: false }
          - { label: Instagram — text to show, name: instagramLabel, widget: string, required: false }
          - { label: Instagram — web address, name: instagramUrl, widget: string, required: false, hint: Used by the footer icon. Leave empty to hide it. }

      # ------------------------------------------------------- Site & footer
      - name: general
        label: Site & footer
        file: content/general.yml
        format: yml
        description: Your name and tagline, used in the top navigation and the footer.
        fields:
          - { label: Your name, name: siteName, widget: string, hint: Shown in the top left and in the footer. }
          - { label: Tagline, name: tagline, widget: string, hint: 'The blue line under your name in the footer.' }

  # =============================================================== Projects
  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    extension: yml
    format: yml
    create: true
    delete: true
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{number}} · {{title}}"
    media_folder: /public/uploads/projects
    public_folder: /uploads/projects
    description: One entry per case study. The preview shows the finished page.
    editor:
      preview: true
    fields:
      - { label: Project name, name: title, widget: string }
      - label: Web address
        name: slug
        widget: string
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', "Lowercase letters, numbers and dashes only"]
        hint: >-
          The page address, so "99-group" becomes /projects/99-group. Changing
          this on an existing project changes its link.
      - label: Name in capitals
        name: displayTitle
        widget: string
        required: false
        hint: How the name is written on the card and case study, for example "99 GROUP".
      - { label: Number, name: number, widget: string, hint: 'Shown on the card corner, for example 01.' }
      - { label: Category, name: category, widget: string, hint: 'The blue line above the name, for example "Performance / Growth".' }
      - label: Short category
        name: categoryShort
        widget: string
        required: false
        hint: A shorter version used on the "Related projects" cards.
      - { label: Year, name: year, widget: string, required: false, hint: Stored for your own reference. Not shown on the site. }
      - label: Position in the project list
        name: order
        widget: number
        value_type: int
        default: 1
        hint: 1 appears first.
      - label: Featured
        name: featured
        widget: boolean
        default: true
        hint: Also add the project to Homepage → "Projects shown on the homepage" for it to appear in the carousel.
      - label: Main project image
        name: heroImage
        widget: image
        required: false
        hint: >-
          Optional. Replaces the built-in graphic on both the project card and
          the case study page. Use JPG or PNG.
      - label: Project logo
        name: logo
        widget: image
        required: false
        hint: Optional. A small logo shown in the corner of the project card.
      - label: Built-in graphic
        name: visual
        widget: select
        default: dashboard
        hint: The illustration used when no main image is uploaded.
        options:
          - { label: "Dashboard / campaign", value: dashboard }
          - { label: "Automotive", value: automotive }
          - { label: "Devices / laptop", value: devices }
      - label: Tags
        name: tags
        widget: list
        required: false
        hint: The small pills on the case study page.
        field: { label: Tag, name: tag, widget: string }
      - { label: Card description, name: shortDescription, widget: text, hint: The sentence on the homepage project card. }
      - { label: Case study introduction, name: heroDescription, widget: text, hint: The opening paragraph at the top of the case study page. }
      - label: Numbers on the card
        name: cardMetrics
        widget: list
        required: false
        collapsed: false
        label_singular: Number
        summary: "{{fields.value}} — {{fields.label}}"
        hint: Leave empty and the card shows the tags instead.
        fields:
          - { label: The number, name: value, widget: string }
          - { label: What it measures, name: label, widget: string }
      - label: Case study sections
        name: chapters
        widget: list
        required: false
        label_singular: Section
        summary: "{{fields.label}} — {{fields.title}}"
        hint: >-
          The main body of the case study — usually Context, Challenge,
          Strategy and Execution, in the order they should appear.
        fields:
          - { label: Section label, name: label, widget: string, hint: 'The small word in the left margin, for example "Challenge".' }
          - { label: Section heading, name: title, widget: string }
          - label: Paragraphs
            name: body
            widget: list
            required: false
            hint: One box per paragraph.
            field: { label: Paragraph, name: paragraph, widget: text }
          - label: Bullet points
            name: bullets
            widget: list
            required: false
            hint: Shown as a two-column list of short points.
            field: { label: Bullet, name: bullet, widget: string }
          - label: Cards
            name: columns
            widget: list
            required: false
            label_singular: Card
            summary: "{{fields.title}}"
            hint: Small boxes side by side, used for strategy pillars.
            fields:
              - { label: Card title, name: title, widget: string }
              - label: Points in this card
                name: items
                widget: list
                field: { label: Item, name: item, widget: string }
      - label: Measured impact
        name: impact
        widget: object
        collapsed: false
        fields:
          - { label: Section label, name: label, widget: string, default: "Measured Impact" }
          - { label: Who these results belong to, name: attribution, widget: string, required: false }
          - label: Supporting text
            name: note
            widget: text
            required: false
            hint: The small print explaining where and when the results come from.
          - label: Result numbers
            name: items
            widget: list
            required: false
            collapsed: false
            label_singular: Number
            summary: "{{fields.value}} — {{fields.label}}"
            fields:
              - { label: The number, name: value, widget: string }
              - { label: What it measures, name: label, widget: string }
          - label: Results in words
            name: qualitative
            widget: list
            required: false
            hint: Use these instead of numbers where you have no verified figure. Never invent one.
            field: { label: Point, name: point, widget: string }
      - label: Key learning
        name: learning
        widget: text
        required: false
        hint: The quote near the bottom of the case study. Leave empty to hide that section.
